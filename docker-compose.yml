
x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.11
  env_file:
    - .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__OPENLINEAGE__DISABLED: "false"
    AIRFLOW__OPENLINEAGE__TRANSPORT: '{"type": "http", "url": "http://marquez:5000", "endpoint": "api/v1/lineage"}'
    _PIP_ADDITIONAL_REQUIREMENTS: >-
      apache-airflow-providers-openlineage==1.11.0
      dlt[filesystem]==1.17.1
      requests==2.32.3
      dbt-duckdb==1.8.3
      openlineage-dbt==1.26.0
  volumes:
    - ./orchestration/airflow/dags:/opt/airflow/dags
    - ${DATA_ROOT:-./.local_data_platform}/airflow/logs:/opt/airflow/logs
    - ./ingestion:/opt/local_data_platform/ingestion
    - ./transformation/dbt:/opt/local_data_platform/transformation/dbt
    - ${DATA_ROOT:-./.local_data_platform}/warehouse:/opt/local_data_platform/.local_data_platform/warehouse
    - ${DATA_ROOT:-./.local_data_platform}/dbt:/opt/local_data_platform/.local_data_platform/dbt
    - ${DATA_ROOT:-./.local_data_platform}/duckdb:/opt/local_data_platform/.local_data_platform/duckdb
  depends_on:
    postgres-airflow:
      condition: service_healthy
    marquez:
      condition: service_started

services:
  postgres-airflow:
    image: postgres:16.3-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - ${DATA_ROOT:-./.local_data_platform}/postgres-airflow:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    command: >-
      bash -c "airflow db migrate &&
      airflow users create
      --username ${AIRFLOW_ADMIN_USERNAME:-admin}
      --password ${AIRFLOW_ADMIN_PASSWORD:-admin}
      --firstname Admin
      --lastname User
      --role Admin
      --email ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  postgres-marquez:
    image: postgres:16.3-alpine
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    volumes:
      - ${DATA_ROOT:-./.local_data_platform}/postgres-marquez:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez"]
      interval: 10s
      timeout: 5s
      retries: 5

  marquez:
    image: marquezproject/marquez:0.50.0
    environment:
      MARQUEZ_PORT: 5000
      MARQUEZ_ADMIN_PORT: 5001
      POSTGRES_URL: jdbc:postgresql://postgres-marquez:5432/marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
    ports:
      - "5000:5000"
      - "5001:5001"
    depends_on:
      postgres-marquez:
        condition: service_healthy

  marquez-web:
    image: marquezproject/marquez-web:0.50.0
    environment:
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: 5000
      WEB_PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - marquez

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.1.0
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - ${DATA_ROOT:-./.local_data_platform}/loki:/loki
    ports:
      - "3100:3100"
